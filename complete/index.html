<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>신청 완료 | 하이퍼글라스</title>
  <meta name="description" content="상담 신청이 완료되었습니다. 빠르게 연락드리겠습니다." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://hipergnw.github.io/complete/" />
  <link rel="icon" href="/favicon.ico" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="하이퍼지엔더블유" />
  <meta property="og:title" content="신청이 완료됐습니다 | 하이퍼글라스" />
  <meta property="og:description" content="빠르게 연락드리겠습니다. 급하실 경우 010-9736-7035로 연락주세요." />
  <meta property="og:url" content="https://hipergnw.github.io/complete/" />
  <meta property="og:image" content="https://hipergnw.github.io/og-image.png?v=2" />
  <meta property="og:locale" content="ko_KR" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --c-bg:       #f7fbf8;
      --c-green-2:  #2d6a4f;
      --c-green-3:  #52b788;
      --c-green-4:  #b7e4c7;
      --c-green-5:  #f0faf4;
      --c-gold:     #c9a84c;
      --c-text-1:   #111f14;
      --c-text-2:   #2c3e2d;
      --c-text-3:   #5a7060;
      --c-border:   #ddeee5;
      --r-lg: 16px;
      --r-xl: 24px;
      --r-pill: 100px;
      --sh-lg: 0 12px 40px rgba(26,58,42,0.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: radial-gradient(circle at 50% 0%, #eaf6ee 0%, var(--c-bg) 60%);
      color: var(--c-text-2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 1px solid var(--c-border);
      border-radius: var(--r-xl);
      box-shadow: var(--sh-lg);
      padding: 3rem 2rem 2.5rem;
      text-align: center;
      animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Check badge */
    .check {
      width: 84px;
      height: 84px;
      margin: 0 auto 1.75rem;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--c-green-3), var(--c-green-2));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 22px rgba(45,106,79,0.35);
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.25s both;
    }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    .check svg { width: 42px; height: 42px; }
    .check svg path {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: draw 0.5s ease 0.6s forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    h1 {
      font-family: 'Noto Serif KR', serif;
      font-weight: 700;
      font-size: 1.7rem;
      color: var(--c-text-1);
      letter-spacing: -0.02em;
      margin-bottom: 0.9rem;
    }
    .lead {
      font-size: 1.02rem;
      line-height: 1.7;
      color: var(--c-text-2);
      margin-bottom: 1.75rem;
    }

    .urgent {
      background: var(--c-green-5);
      border: 1px solid var(--c-border);
      border-radius: var(--r-lg);
      padding: 1.1rem 1.25rem;
      font-size: 0.92rem;
      line-height: 1.65;
      color: var(--c-text-3);
      margin-bottom: 1.75rem;
    }
    .urgent a.tel {
      display: inline-block;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--c-green-2);
      letter-spacing: 0.01em;
      margin: 0.15rem 0;
    }

    .thanks {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.05rem;
      color: var(--c-green-2);
      margin-bottom: 2rem;
    }

    .btns { display: flex; flex-direction: column; gap: 0.75rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 700;
      font-size: 0.98rem;
      padding: 0.9rem 1.5rem;
      border-radius: var(--r-pill);
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--c-green-3), var(--c-green-2));
      color: #fff;
      box-shadow: 0 6px 18px rgba(45,106,79,0.28);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(45,106,79,0.35); }
    .btn-ghost {
      background: #fff;
      color: var(--c-text-3);
      border: 1px solid var(--c-border);
    }
    .btn-ghost:hover { background: var(--c-green-5); color: var(--c-green-2); }

    @media (max-width: 420px) {
      .card { padding: 2.5rem 1.4rem 2rem; }
      h1 { font-size: 1.45rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12.5l5 5 11-11" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>신청이 완료됐습니다</h1>
    <p class="lead">빠르게 연락드리겠습니다.</p>

    <div class="urgent">
      급하실 경우<br>
      <a class="tel" href="tel:010-9736-7035">010-9736-7035</a><br>
      로 연락주시면 친절하게 답변드리겠습니다.
    </div>

    <p class="thanks">감사합니다.</p>

    <div class="btns">
      <a class="btn btn-primary" href="tel:010-9736-7035">📞 지금 전화하기</a>
      <a class="btn btn-ghost" href="/">홈으로 돌아가기</a>
    </div>
  </main>
</body>
</html>
